{% extends "layout.html" %}

{% block title %}
chao page
{% endblock %}

{% block content %}
    <h1>All chai </h1>

    {% for chai in chais %}
        <div>
            <h2>{{ chai.name }}</h2>
            <p>Type: {{ chai.get_type_display }}</p>
            <p>Date Added: {{ chai.date_added }}</p>
            <img src="{{ chai.image.url }}" alt="{{ chai.name }}" width="200">
        </div>
   {% endfor %}

{% endblock %}
